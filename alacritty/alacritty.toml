[general]
import = [ "~/.config/alacritty/themes/themes/kanagawa_wave.toml" ]

[env]
TERM = "xterm-256color"
LANG = "C.UTF-8"

[window]
startup_mode = "SimpleFullscreen"
padding = { x = 8, y = 14 }
opacity = 0.90
decorations = "Buttonless"
blur = true

[selection]
save_to_clipboard = true

[font]
normal.family = "MesloLGS Nerd Font Mono"
size = 15
