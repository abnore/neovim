set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# General mappings
set -g mouse on                 # Enable mouse support
set -g set-clipboard on         # Use system clipboard
set -g status-interval 4        # default 15
set -g detach-on-destroy off    # Don't exit tmux when closing a session
set -g allow-passthrough on

# Control-space before all the bindings and all the commands in tmux
unbind C-b
set -g prefix C-Space

# Correct path for sourcefile
bind r source-file ~/.config/tmux/tmux.conf

# Window splitting, horizontally and vertically
bind % split-window -h -c "#{pane_current_path}"
unbind \"
bind - split-window -v -c "#{pane_current_path}"

# New window will also open in same path
bind c new-window -c "#{pane_current_path}"

# r makes it repeatable
bind -r j resize-pane -D 2
bind -r k resize-pane -U 2
bind -r l resize-pane -R 4
bind -r h resize-pane -L 4
bind -r m resize-pane -Z # maximizes

# Enable vi mode to allow vim movements
set-window-option -g mode-keys vi

# v starts selecting and y copy texts with pbcpy, but only in copy-mode
# -T specifies mapping only in copy-mode etc. Default is root. prefix is another
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"

# Dont exit when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
# Custom theme, no plugins
# =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
# Colors (custom themed colors based on kanagawa)

gray_light="#dcd7ba"    # fujiWhite – bright, readable, Kanagawa canonical
gray_medium="#9cabca"   # springViolet2 – cooler than gray, lifts text
gray_dark="#1f1f28"     # sumiInk3 – true Kanagawa ink background
green="#98bb6c"         # springGreen – clean, lively, not muddy
blue="#7e9cd8"          # crystalBlue – crisp statusline blue
cyan="#7fb4ca"          # springBlue – cool cyan, distinct from blue

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Auto renumbers when windows closes

# ----- Status bar layout
set -g status-position top
set -g status-left-length 100
set -g status-justify left
set -g status-style "fg=${gray_light},bg=${gray_dark}"

# ----- Left side
set -g status-left "#[fg=${green},bold]  #S | "

# ----- Window list
set -g window-status-current-format "#[fg=${cyan},bold] #[underscore]#I:#W"
set -g window-status-format " #I:#W"

# ----- Right side
set -g status-right " \
#[fg=${gray_medium}] \
#[fg=${cyan},bold]#{?client_prefix, PREFIX,}\
#[fg=${green},bold]#{?#{==:#{pane_mode},copy-mode}, COPY,}\
#[fg=${blue}]#{?window_zoomed_flag, ZOOM,}"

# ----- Messages & modes
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue}"

# ----- Pane borders
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${green}"

# =-=-=-=-=-=-=-=-=-=-=-=-=-=--- Pugins live here ----=-=-=-=-=-=-=-=-=-=-=-=-=
#
# list of tmux plugins goes here
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of this file)
run '~/.config/tmux/plugins/tpm/tpm'

# =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

# This lets me use C-k and C-l in the terminal as usual, and navigate with hj,
# which is enough for basic pane manouvers
unbind -T root C-k
unbind -T root C-l
